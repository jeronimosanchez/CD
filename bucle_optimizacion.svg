<svg viewBox="0 0 900 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'DM Sans', sans-serif">
<title>Bucle de optimización del Sistema A</title>
<desc>Agente en producción: DETECTA (QAP halla el fallo), DIAGNOSTICA la causa, REPARA (GEN + ACT genera el arreglo) y VALIDA (confirma que funciona). Si no se resuelve, vuelve al inicio; si se resuelve, aprende (Sistema B hacia CD/kb).</desc>
<rect x="0" y="0" width="900" height="340" fill="#16191e"/>
<defs>
<marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2bb87f"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0b84a"/></marker>
</defs>

<text x="120" y="40" fill="#9ca3af" font-size="12" text-anchor="middle">agente en producción</text>
<path d="M120,50 L120,118" stroke="#9ca3af" stroke-width="1.8" fill="none" marker-end="url(#gr)"/>

<g stroke="#2bb87f" stroke-width="2.2" fill="none">
<path d="M200,152 L240,152" marker-end="url(#gr)"/>
<path d="M400,152 L440,152" marker-end="url(#gr)"/>
<path d="M600,152 L640,152" marker-end="url(#gr)"/>
</g>

<rect x="40" y="120" width="160" height="64" rx="10" fill="#15795a"/>
<text x="120" y="147" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">DETECTA</text>
<text x="120" y="165" fill="#a7f3d0" font-size="10" text-anchor="middle">QAP &#183; halla el fallo</text>

<rect x="240" y="120" width="160" height="64" rx="10" fill="#15795a"/>
<text x="320" y="147" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">DIAGNOSTICA</text>
<text x="320" y="165" fill="#a7f3d0" font-size="10" text-anchor="middle">la causa</text>

<rect x="440" y="120" width="160" height="64" rx="10" fill="#15795a"/>
<text x="520" y="147" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">REPARA</text>
<text x="520" y="165" fill="#a7f3d0" font-size="10" text-anchor="middle">GEN+ACT &#183; el arreglo</text>

<rect x="640" y="120" width="160" height="64" rx="10" fill="#15795a"/>
<text x="720" y="147" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">VALIDA</text>
<text x="720" y="165" fill="#a7f3d0" font-size="10" text-anchor="middle">confirma el fix</text>

<path d="M720,184 L720,250 L120,250 L120,186" stroke="#e0b84a" stroke-width="2" fill="none" marker-end="url(#am)"/>
<text x="430" y="242" fill="#e0b84a" font-size="11.5" text-anchor="middle">no resuelto</text>

<path d="M150,250 L150,292" stroke="#2bb87f" stroke-width="2" fill="none" marker-end="url(#gr)"/>
<text x="168" y="296" fill="#a7f3d0" font-size="11.5" text-anchor="start">resuelto &#8594; aprende (Sistema B &#8594; CD/kb)</text>
</svg>
